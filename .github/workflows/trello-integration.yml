name: Trello Integration

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  trello-actions:
    runs-on: ubuntu-latest
    steps:
      # 1. CUANDO SE CREA UNA ISSUE -> CREA LA TARJETA EN "POR HACER"
      - name: Create Trello Card on Issue Opened
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          CARD_NAME="${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          DESC="Creado desde GitHub: ${{ github.event.issue.html_url }}"
          
          curl --request POST \
            --url "https://api.trello.com/1/cards?idList=6a1b4fe2a01690f4ad3e56db&key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}" \
            --data-urlencode "name=$CARD_NAME" \
            --data-urlencode "desc=$DESC"

      # 2. CUANDO SE ABRE UN PR -> MUEVE A "EN PROGRESO"
      # (Busca la tarjeta por el número de issue que pusiste en el título o descripción del PR, ej: #12)
      - name: Move to In Progress on PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          # Extraemos el patrón '#4' exacto del PR
          RAW_NUM=$(echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -oE '#[0-9]+' | head -n 1)
          
          if [ -z "$RAW_NUM" ]; then
            echo "No se encontró ninguna referencia a una issue (ej: #4) en el PR."
            exit 0
          fi
          
          echo "Buscando la tarjeta que contenga la cadena '$RAW_NUM' en la lista Por Hacer..."
          
          # En lugar de usar /search, listamos TODAS las tarjetas de la lista "Por Hacer"
          LIST_CARDS=$(curl --request GET \
            --url "https://api.trello.com/1/lists/6a1b4fe2a01690f4ad3e56db/cards?key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}")
          
          # Filtramos localmente con 'jq' buscando la tarjeta cuyo nombre contenga (e.g., "#4")
          CARD_ID=$(echo "$LIST_CARDS" | jq -r --arg target "$RAW_NUM" '.[] | select(.name | contains($target)) | .id' | head -n 1)
          
          if [ "$CARD_ID" != "null" ] && [ ! -z "$CARD_ID" ]; then
            echo "Tarjeta encontrada de forma precisa (ID: $CARD_ID). Moviendo a En Progreso..."
            curl --request PUT \
              --url "https://api.trello.com/1/cards/$CARD_ID?idList=6a1b4fe803a3b2abaf737d84&key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}"
          else
            echo "No se encontró ninguna tarjeta en la lista que contenga la cadena $RAW_NUM"
          fi

      # 3. MOVER A APROBADO AL ACEPTAR PR
      - name: Move to Done on PR Approval
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        run: |
          RAW_NUM=$(echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" | grep -oE '#[0-9]+' | head -n 1)
          
          if [ -z "$RAW_NUM" ]; then
            echo "No se encontró ninguna referencia a una issue en el PR."
            exit 0
          fi
          
          echo "Buscando la tarjeta que contenga la cadena '$RAW_NUM' en la lista En Progreso..."
          
          # Listamos las tarjetas de la lista "En Progreso"
          LIST_CARDS=$(curl --request GET \
            --url "https://api.trello.com/1/lists/6a1b4fe803a3b2abaf737d84/cards?key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}")
          
          # Filtramos localmente con 'jq'
          CARD_ID=$(echo "$LIST_CARDS" | jq -r --arg target "$RAW_NUM" '.[] | select(.name | contains($target)) | .id' | head -n 1)
          
          if [ "$CARD_ID" != "null" ] && [ ! -z "$CARD_ID" ]; then
            echo "Tarjeta encontrada (ID: $CARD_ID). Moviendo a Aprobado..."
            curl --request PUT \
              --url "https://api.trello.com/1/cards/$CARD_ID?idList=6a1b4fe53a89cf2b28e8de6f&key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}"
          else
            echo "No se encontró la tarjeta en la lista de En Progreso."
          fi
